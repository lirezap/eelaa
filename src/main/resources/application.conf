libraries {
    native {
        lz4 {
            path = "./"
            path = ${?LIBRARIES_NATIVE_LZ4_PATH}
        }

        lmdb {
            path = "./"
            path = ${?LIBRARIES_NATIVE_LMDB_PATH}
        }
    }
}

ledgers {
    default {
        enabled = true
        enabled = ${?LEDGERS_DEFAULT_ENABLED}

        dataDirectoryPath = "./"
        dataDirectoryPath = ${?LEDGERS_DEFAULT_DATA_DIRECTORY_PATH}

        executorMaxWaitQueueSize = 64000
        executorMaxWaitQueueSize = ${?LEDGERS_DEFAULT_EXECUTOR_MAX_WAIT_QUEUE_SIZE}

        succeededTransactionsCacheTTLSeconds = 900
        succeededTransactionsCacheTTLSeconds = ${?LEDGERS_DEFAULT_SUCCEEDED_TRANSACTIONS_CACHE_TTL_SECONDS}

        initialAccountsCap = 64000
        initialAccountsCap = ${?LEDGERS_DEFAULT_INITIAL_ACCOUNTS_CAP}

        initialWalletsPerAccountCap = 4
        initialWalletsPerAccountCap = ${?LEDGERS_DEFAULT_INITIAL_WALLETS_PER_ACCOUNT_CAP}

        databaseSizeGBs = 100
        databaseSizeGBs = ${?LEDGERS_DEFAULT_DATABASE_SIZE_GBS}
    }

    fast {
        enabled = false
        enabled = ${?LEDGERS_FAST_ENABLED}

        dataDirectoryPath = "./"
        dataDirectoryPath = ${?LEDGERS_FAST_DATA_DIRECTORY_PATH}

        executorMaxWaitQueueSize = 64000
        executorMaxWaitQueueSize = ${?LEDGERS_FAST_EXECUTOR_MAX_WAIT_QUEUE_SIZE}

        succeededTransactionsCacheTTLSeconds = 900
        succeededTransactionsCacheTTLSeconds = ${?LEDGERS_FAST_SUCCEEDED_TRANSACTIONS_CACHE_TTL_SECONDS}

        initialAccountsCap = 64000
        initialAccountsCap = ${?LEDGERS_FAST_INITIAL_ACCOUNTS_CAP}

        initialWalletsPerAccountCap = 4
        initialWalletsPerAccountCap = ${?LEDGERS_FAST_INITIAL_WALLETS_PER_ACCOUNT_CAP}

        databaseSizeGBs = 100
        databaseSizeGBs = ${?LEDGERS_FAST_DATABASE_SIZE_GBS}
    }
}

servers {
    tcp {
        host = "localhost"
        host = ${?SERVERS_TCP_HOST}

        port = 7178
        port = ${?SERVERS_TCP_PORT}

        // 0 means Runtime.getRuntime().availableProcessors()
        eventLoopGroupNThreads = 0
        eventLoopGroupNThreads = ${?SERVERS_TCP_EVENT_LOOP_GROUP_N_THREADS}

        soBacklog = 8192
        soBacklog = ${?SERVERS_TCP_SO_BACKLOG}

        maxFrameSize = 5242880
        maxFrameSize = ${?SERVERS_TCP_MAX_FRAME_SIZE}

        lowWriteBufferWaterMark = 32768
        lowWriteBufferWaterMark = ${?SERVERS_TCP_LOW_WRITE_BUFFER_WATER_MARK}

        highWriteBufferWaterMark = 131072
        highWriteBufferWaterMark = ${?SERVERS_TCP_HIGH_WRITE_BUFFER_WATER_MARK}

        tlsContextConfig {
            useTls = false
            useTls = ${?SERVERS_TCP_TLS_CONTEXT_CONFIG_USE_TLS}

            serverCertPath = "./"
            serverCertPath = ${?SERVERS_TCP_TLS_CONTEXT_CONFIG_SERVER_CERT_PATH}

            serverKeyPath = "./"
            serverKeyPath = ${?SERVERS_TCP_TLS_CONTEXT_CONFIG_SERVER_KEY_PATH}

            useOcsp = false
            useOcsp = ${?SERVERS_TCP_TLS_CONTEXT_CONFIG_USE_OCSP}

            sessionCacheSize = 20000
            sessionCacheSize = ${?SERVERS_TCP_TLS_CONTEXT_CONFIG_SESSION_CACHE_SIZE}

            sessionTimeoutSeconds = 300
            sessionTimeoutSeconds = ${?SERVERS_TCP_TLS_CONTEXT_CONFIG_SESSION_TIMEOUT_SECONDS}

            handshakeTimeoutSeconds = 5
            handshakeTimeoutSeconds = ${?SERVERS_TCP_TLS_CONTEXT_CONFIG_HANDSHAKE_TIMEOUT_SECONDS}
        }

        allIdleTimeoutSeconds = 120
        allIdleTimeoutSeconds = ${?SERVERS_TCP_ALL_IDLE_TIMEOUT_SECONDS}

        logFrameHeader = false
        logFrameHeader = ${?SERVERS_TCP_LOG_FRAME_HEADER}

        cpuHeavyTaskExecutorConfig {
            nThreads = 4
            nThreads = ${?SERVERS_TCP_CPU_HEAVY_TASK_EXECUTOR_CONFIG_N_THREADS}

            shutdownQuietPeriodSeconds = 1
            shutdownQuietPeriodSeconds = ${?SERVERS_TCP_CPU_HEAVY_TASK_EXECUTOR_CONFIG_SHUTDOWN_QUIET_PERIOD_SECONDS}

            shutdownWaitTimeSeconds = 30
            shutdownWaitTimeSeconds = ${?SERVERS_TCP_CPU_HEAVY_TASK_EXECUTOR_CONFIG_SHUTDOWN_WAIT_TIME_SECONDS}
        }

        shutdownQuietPeriodSeconds = 1
        shutdownQuietPeriodSeconds = ${?SERVERS_TCP_SHUTDOWN_QUIET_PERIOD_SECONDS}

        shutdownWaitTimeSeconds = 30
        shutdownWaitTimeSeconds = ${?SERVERS_TCP_SHUTDOWN_WAIT_TIME_SECONDS}

        detectResourceLeak = false
        detectResourceLeak = ${?SERVERS_TCP_DETECT_RESOURCE_LEAK}

        httpServerConfig {
            enabled = false
            enabled = ${?SERVERS_TCP_HTTP_SERVER_CONFIG_ENABLED}

            maxInitialLineLength = 4096
            maxInitialLineLength = ${?SERVERS_TCP_HTTP_SERVER_CONFIG_MAX_INITIAL_LINE_LENGTH}

            maxHeaderSize = 8192
            maxHeaderSize = ${?SERVERS_TCP_HTTP_SERVER_CONFIG_MAX_HEADER_SIZE}

            maxChunkSize = 8192
            maxChunkSize = ${?SERVERS_TCP_HTTP_SERVER_CONFIG_MAX_CHUNK_SIZE}

            maxContentLength = 5242880
            maxContentLength = ${?SERVERS_TCP_HTTP_SERVER_CONFIG_MAX_CONTENT_LENGTH}

            httpServerCompressionConfig {
                contentSizeThreshold = 512
                contentSizeThreshold = ${?SERVERS_TCP_HTTP_SERVER_CONFIG_HTTP_SERVER_COMPRESSION_CONFIG_CONTENT_SIZE_THRESHOLD}

                compressionLevel = 6
                compressionLevel = ${?SERVERS_TCP_HTTP_SERVER_CONFIG_HTTP_SERVER_COMPRESSION_CONFIG_COMPRESSION_LEVEL}

                windowBits = 15
                windowBits = ${?SERVERS_TCP_HTTP_SERVER_CONFIG_HTTP_SERVER_COMPRESSION_CONFIG_WINDOW_BITS}

                memLevel = 8
                memLevel = ${?SERVERS_TCP_HTTP_SERVER_CONFIG_HTTP_SERVER_COMPRESSION_CONFIG_MEM_LEVEL}
            }

            forceConnectionSequenceId = true
            forceConnectionSequenceId = ${?SERVERS_TCP_HTTP_SERVER_CONFIG_FORCE_CONNECTION_SEQUENCE_ID}

            forceRequestTimestamp = true
            forceRequestTimestamp = ${?SERVERS_TCP_HTTP_SERVER_CONFIG_FORCE_REQUEST_TIMESTAMP}
        }
    }
}
